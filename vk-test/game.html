<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КОСМИЧЕСКИЕ ДРАГОЦЕННОСТИ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<script>
window.PLATFORM = 'vk';
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
</script>

<!-- Loading spinner -->
<div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#0f0a28;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;">
    <div style="width:60px;height:60px;border:4px solid rgba(255,215,0,0.3);border-top:4px solid #FFD700;border-radius:50%;animation:spin 1s linear infinite;"></div>
    <p style="color:#FFD700;margin-top:20px;font-family:Arial,sans-serif;">Загрузка...</p>
    <style>@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}</style>
</div>

<div class="stars"></div>
<div class="stars-deep"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>
<div class="shooting-star"></div>

<div class="app">
    <canvas id="viewport" width="650" height="650"></canvas>
    <div class="game-field-overlay"></div>
    <div id="rewarded-button" class="rewarded-button" style="display:none">+30s</div>

    <div class="score-counter">0</div>
    <div class="best-score">Рекорд: <span>—</span></div>
    <div class="timer"><div class="timer_filler"></div></div>

    <button id="new-game-button">Новая игра</button>
    <div class="controllers">
        <div id="auto-play-button" data-role="checkbox">ИИ-бот</div>
        <div id="show-move-button" data-role="checkbox">Ходы</div>
    </div>

    <div class="boosters">
        <button id="booster-show-move"><span class="button-badge"></span></button>
        <button id="booster-blow-color"><span class="button-badge"></span></button>
        <button id="booster-blow-nearby"><span class="button-badge"></span></button>
        <button id="booster-any-color"><span class="button-badge"></span></button>
    </div>
</div>

<!-- VK Bridge — load from CDN, the official working pattern -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<!-- VK SDK integration (simplified) -->
<script src="vk-sdk.js"></script>

<!-- Game engine -->
<script src="app.js"></script>

<script>
// Hide loading screen after VK Bridge initializes
function hideLoader() {
    var loader = document.getElementById('loading-screen');
    if (loader) loader.style.display = 'none';
}

// Safety: always hide loader after 5 seconds
setTimeout(hideLoader, 5000);

// Initialize VK Bridge
if (typeof vkBridge !== 'undefined') {
    console.log('Initializing VK Bridge...');
    vkBridge.send('VKWebAppInit')
        .then(function(result) {
            console.log('VKWebAppInit OK:', result);
            hideLoader();
        })
        .catch(function(err) {
            console.warn('VKWebAppInit failed (may be outside VK):', err.message || err);
            hideLoader();
        });
} else {
    console.log('vkBridge not available, hiding loader');
    hideLoader();
}
</script>

</body>
</html>
