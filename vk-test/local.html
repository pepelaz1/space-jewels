<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Test — Local Bridge</title>
<style>
body { font-family: Arial; margin: 20px; background: #111; color: #0f0; }
.error { color: #f44; } .success { color: #0f0; } .loading { color: #ff0; }
</style>
</head>
<body>
<h1>VK Mini App Test — Local Bridge</h1>
<div id="status" class="loading">⏳ Loading local vk-bridge...</div>
<div id="result"></div>

<script src="../resources/vk-bridge.js"></script>
<script>
var s = document.getElementById('status');
var r = document.getElementById('result');
function add(m, c) { var p = document.createElement('p'); p.className = c||''; p.textContent = new Date().toLocaleTimeString() + ' ' + m; r.appendChild(p); }

add('Local bridge script loaded', '');
if (typeof vkBridge === 'undefined') {
    s.className = 'error'; s.textContent = '❌ vkBridge undefined!';
    add('vkBridge is undefined after local script', 'error');
} else {
    add('vkBridge found, sending VKWebAppInit...', '');
    vkBridge.send('VKWebAppInit')
        .then(function(d) {
            s.className = 'success'; s.textContent = '✅ VKWebAppInit SUCCESS!';
            add('OK: ' + JSON.stringify(d), 'success');
        })
        .catch(function(e) {
            s.className = 'error'; s.textContent = '❌ FAILED: ' + (e.message || JSON.stringify(e));
            add('Error: ' + JSON.stringify(e), 'error');
        });
}
</script>
</body>
</html>
