<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Моё первое приложение</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .loader { color: #3f8ae0; font-size: 18px; }
    .error { color: #e64646; }
    .success { color: #4bb34b; }
    .card { background: #f5f5f5; border-radius: 16px; padding: 32px; max-width: 400px; width: 100%; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <p class="loader">⏳ Приложение загружается...</p>
  </div>

  <!-- VK Bridge — официальный способ подключения -->
  <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

  <script>
    var appEl = document.getElementById('app');

    // Шаг 1: инициализация приложения
    vkBridge.send('VKWebAppInit')
      .then(function() {
        console.log('VKWebAppInit — успешно');
        // Шаг 2: получаем данные пользователя
        return vkBridge.send('VKWebAppGetUserInfo');
      })
      .then(function(user) {
        console.log('Пользователь:', user);
        // Шаг 3: показываем приветствие
        appEl.innerHTML =
          '<div class="card success">' +
          '<img class="avatar" src="' + (user.photo_100 || '') + '" alt="avatar" onerror="this.style.display=\'none\'">' +
          '<h1>Привет, ' + user.first_name + ' ' + user.last_name + '!</h1>' +
          '<p style="color:#818c99;margin-top:8px;">Ваш ID: ' + user.id + '</p>' +
          '<p style="margin-top:16px;font-size:14px;">✅ Приложение работает!</p>' +
          '</div>';
      })
      .catch(function(error) {
        console.error('Ошибка:', error);
        // Показываем ошибку
        var errMsg = error.message || JSON.stringify(error);
        appEl.innerHTML =
          '<div class="card error">' +
          '<h1>❌ Ошибка</h1>' +
          '<p style="margin-top:12px;word-break:break-all;">' + errMsg + '</p>' +
          '<p style="margin-top:16px;font-size:12px;color:#818c99;">' +
          'Страница загружена из iframe: ' + (window.parent !== window) +
          '</p>' +
          '</div>';
      });
  </script>
</body>
</html>
