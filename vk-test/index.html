<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VK Test — CDN Bridge</title>
<style>
body { font-family: Arial; margin: 20px; background: #111; color: #0f0; }
h1 { color: #fff; }
pre { background: #000; padding: 10px; border-radius: 5px; white-space: pre-wrap; }
.error { color: #f44; }
.success { color: #0f0; }
.loading { color: #ff0; }
</style>
</head>
<body>
<h1>VK Mini App Test — CDN Bridge</h1>
<div id="status" class="loading">⏳ Loading vk-bridge from CDN...</div>
<div id="result"></div>

<!-- Approach 1: CDN Bridge (official guide) -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
<script>
var statusEl = document.getElementById('status');
var resultEl = document.getElementById('result');

function show(msg, cls) {
    var p = document.createElement('p');
    p.className = cls || '';
    p.textContent = new Date().toLocaleTimeString() + ' ' + msg;
    resultEl.appendChild(p);
}

show('Script loaded from CDN', '');

if (typeof vkBridge === 'undefined') {
    statusEl.className = 'error';
    statusEl.textContent = '❌ vkBridge not defined after CDN script!';
    show('vkBridge is undefined', 'error');
} else {
    show('vkBridge found, sending VKWebAppInit...', '');
    vkBridge.send('VKWebAppInit')
        .then(function(data) {
            statusEl.className = 'success';
            statusEl.textContent = '✅ VKWebAppInit SUCCESS!';
            show('VKWebAppInit OK: ' + JSON.stringify(data), 'success');
        })
        .catch(function(err) {
            statusEl.className = 'error';
            statusEl.textContent = '❌ VKWebAppInit FAILED: ' + (err.message || JSON.stringify(err));
            show('Error: ' + JSON.stringify(err), 'error');
        });
}
</script>
</body>
</html>
